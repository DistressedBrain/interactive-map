<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plate 05 — InteractiveMap</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; text-align: center; padding: 80px 24px;
    }
    .empty .chip { color: var(--accent); }
    .empty h1 {
      font-family: var(--font-display); font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 800; letter-spacing: -0.02em;
    }
    .empty p { color: var(--text-dim); max-width: 420px; line-height: 1.55; }
    .empty a.back {
      margin-top: 8px; color: var(--text); text-decoration: none;
      border: 1px solid var(--border); padding: 10px 18px; border-radius: 10px;
      transition: background 0.15s ease, transform 160ms var(--ease-out);
    }
    .empty a.back:hover { background: var(--surface-2); }
    .empty a.back:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">Interactive<span>Map</span></a>
  </header>
  <main class="empty">
    <span class="chip">Plate 05</span>
    <h1>Topic 5</h1>
    <p>This plate hasn't been charted yet. Its contents are still out in the field.</p>
    <a class="back" href="../index.html">&larr; Back to the atlas</a>
  </main>
</body>
</html>
