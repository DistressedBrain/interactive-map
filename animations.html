<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev — Animation Picker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pagehead {
      max-width: 1100px; margin: 40px auto 10px; padding: 0 24px;
    }
    .pagehead h1 { font-size: 1.6rem; }
    .pagehead h1 span { color: var(--accent); }
    .pagehead p { color: var(--text-dim); margin-top: 8px; max-width: 640px; }

    .grid {
      max-width: 1100px; margin: 30px auto 60px; padding: 0 24px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 26px;
    }
    .card {
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .card h3 { font-size: 1rem; }
    .card p { font-size: 0.85rem; color: var(--text-dim); flex: 1; }
    .demo-stage {
      height: 170px; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.25); border-radius: 12px;
    }
    /* mini demo widget */
    .demo-stage .widget {
      position: relative; width: 170px; height: 120px; border-radius: 14px;
    }
    .card button {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 0.88rem;
      transition: background 0.15s ease, transform 160ms var(--ease-out);
    }
    .card button:hover { background: var(--surface-2); }
    .card button:active { transform: scale(0.97); }
    .card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .card.active button { background: var(--accent); border-color: var(--accent); color: #fff; }

    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
      background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 999px;
      font-size: 0.88rem; transition: transform 0.3s ease; z-index: 300;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">Interactive<span>Map</span></a>
    <nav class="navlinks">
      <a href="index.html">← Back to homepage</a>
      <a href="dev.html">Layout Editor</a>
    </nav>
  </header>

  <main>
    <div class="pagehead">
      <h1>Animation <span>Picker</span></h1>
      <p>Hover over each demo widget to preview the animation. Click "Use this" to apply it
         to all widgets on the homepage (saved in this browser). Pick "None" to turn animations off.</p>
    </div>

    <div class="grid" id="grid">
      <!-- cards generated by script below -->
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const ANIMS = [
      { cls: "anim-lift",  name: "Lift",        desc: "The widget rises up and grows slightly on hover, with a deeper shadow. Subtle and clean — the current default." },
      { cls: "anim-glow",  name: "Neon Glow",   desc: "On hover the widget's border lights up in its accent color with a soft neon glow around it." },
      { cls: "anim-tilt",  name: "3D Tilt",     desc: "The widget tilts in 3D space toward you on hover, like a card being picked up." },
      { cls: "anim-shine", name: "Shine Sweep", desc: "A diagonal light reflection sweeps across the widget on hover, like light passing over glass." },
      { cls: "anim-float", name: "Floating",    desc: "Widgets constantly bob up and down slowly, each with a different rhythm. No hover needed — always in motion." },
      { cls: "anim-pulse", name: "Pulse",       desc: "A soft ring pulses outward from the widget on a loop. Draws attention — maybe too much for all widgets at once." },
      { cls: "anim-zoom",  name: "Media Zoom",  desc: "The image/video inside zooms in smoothly on hover while the frame stays still. Classic gallery feel." },
      { cls: "anim-blur",  name: "Color Reveal","desc": "Widgets sit dimmed and desaturated; hovering restores full color and brightness. Good focus effect." },
      { cls: "anim-none",  name: "None",        desc: "No animation at all. Completely static widgets." }
    ];

    const grid = document.getElementById("grid");
    const toast = document.getElementById("toast");
    const current = localStorage.getItem("im_anim") || "anim-lift";

    ANIMS.forEach(a => {
      const card = document.createElement("div");
      card.className = "card" + (a.cls === current ? " active" : "");
      card.innerHTML = `
        <div class="demo-stage">
          <div class="widget v-dark ${a.cls === "anim-none" ? "" : a.cls}" style="--wa:#d4a24e">
            <div class="w-blob"></div>
            <div class="w-top"><span class="chip">Topic</span><span class="arrow">↗</span></div>
            <div class="w-bottom"><h3>Hover me</h3></div>
          </div>
        </div>
        <h3>${a.name}</h3>
        <p>${a.desc}</p>
        <button>${a.cls === current ? "✓ In use" : "Use this"}</button>`;
      card.querySelector("button").addEventListener("click", () => {
        localStorage.setItem("im_anim", a.cls);
        document.querySelectorAll(".card").forEach(c => {
          c.classList.remove("active");
          c.querySelector("button").textContent = "Use this";
        });
        card.classList.add("active");
        card.querySelector("button").textContent = "✓ In use";
        toast.textContent = `"${a.name}" is now used on the homepage.`;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      });
      grid.appendChild(card);
    });
  </script>
</body>
</html>
